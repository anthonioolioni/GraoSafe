<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GraoSafe — Monitoramento de grãos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/icone.svg">
<link rel="apple-touch-icon" href="assets/icone.svg">
<meta name="theme-color" content="#0A2A21">
<link rel="stylesheet" href="styles.css">
<script>
  // aplica o tema salvo (ou o do sistema) antes de desenhar a página, para não piscar
  (function () {
    var t = null;
    try { var c = JSON.parse(localStorage.getItem('graosafe_cfg') || '{}'); t = c.tema; } catch (e) {}
    if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<!-- Menu lateral (desktop) -->
<aside id="side" aria-label="Menu principal">
  <a class="brand" href="#/">
    <img class="logo" src="assets/icone.svg" alt="" width="44" height="44">
    <div><b>Grao<span class="safe">Safe</span></b><small>Rondonópolis, MT</small></div>
  </a>

  <div class="grupo">Monitoramento</div>
  <a class="nav" data-rota="" href="#/"><i data-lucide="layout-grid" class="ic"></i><span>Visão geral</span></a>
  <a class="nav" data-rota="silos" href="#/silos"><i data-lucide="database" class="ic"></i><span>Silos</span></a>
  <div class="sub-silos" id="sub-silos"></div>
  <a class="nav" data-rota="alertas" href="#/alertas"><i data-lucide="bell" class="ic"></i><span>Alertas</span><b class="badge" id="badge-alertas"></b></a>

  <div class="grupo">Ferramentas</div>
  <a class="nav" data-rota="sensor" href="#/sensor"><i data-lucide="cpu" class="ic"></i><span>Sensor real</span></a>
  <a class="nav" data-rota="dados" href="#/dados"><i data-lucide="database" class="ic"></i><span>Dados e CSV</span></a>
  <a class="nav" data-rota="config" href="#/config"><i data-lucide="sliders-horizontal" class="ic"></i><span>Configurações</span></a>

  <div class="fonte-box">
    <div class="grupo">Fonte dos dados</div>
    <div class="seg" data-seg="fonte" id="seg-fonte">
      <button type="button" data-v="sim" class="on">Simulação</button>
      <button type="button" data-v="real">Sensor real</button>
    </div>
    <p id="fonte-txt"></p>
  </div>
</aside>

<div id="app">
  <div class="page">
    <header class="topo" id="topo"></header>
    <main id="view" class="view" aria-live="polite"></main>
    <p class="nota centro"><i data-lucide="info" class="ic" style="width:16px;height:16px"></i>Limites simplificados, para fins didáticos; não substituem normas técnicas. Projeto acadêmico — Computação Contemporânea e Inteligência Artificial.</p>
  </div>
</div>

<!-- Barra inferior (celular) -->
<nav id="bottom" aria-label="Navegação"></nav>

<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="relatorio.js"></script>
<script src="app.js"></script>
</body>
</html>
